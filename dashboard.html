<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investor Dashboard</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-4">

    <!-- Header Section -->
    <div class="max-w-md mx-auto bg-gray-800 rounded-xl p-4 shadow-lg mb-4 text-center">
        <h1 class="text-xl font-bold text-emerald-400">📊 PrimeVest Dashboard</h1>
        <p class="text-xs text-gray-400 mt-1">Maligayang pagdating, Investor!</p>
    </div>

    <!-- Pera at Balanse Cards -->
    <div class="max-w-md mx-auto grid grid-cols-1 gap-3 mb-6">
        <div class="bg-gradient-to-r from-emerald-600 to-teal-700 p-4 rounded-xl shadow-md">
            <p class="text-xs uppercase tracking-wider text-emerald-200">Available Balance</p>
            <h2 class="text-3xl font-extrabold mt-1">₱5,000.00</h2>
        </div>
        
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-gray-800 p-4 rounded-xl shadow-md border border-gray-700">
                <p class="text-xs uppercase text-gray-400">Total Invested</p>
                <p class="text-lg font-bold text-amber-400 mt-1">₱2,500.00</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-xl shadow-md border border-gray-700">
                <p class="text-xs uppercase text-gray-400">Total Earnings</p>
                <p class="text-lg font-bold text-emerald-400 mt-1">₱250.00</p>
            </div>
        </div>
    </div>

    <!-- Manual GCash Deposit Section -->
    <div class="max-w-md mx-auto bg-gray-800 rounded-xl p-5 shadow-lg border border-gray-700 mb-6">
        <h3 class="text-md font-semibold text-emerald-400 mb-3">💸 Libreng Cash-In (GCash)</h3>
        <div class="bg-gray-900 p-3 rounded-lg text-sm mb-4 border border-gray-800">
            <p class="text-gray-300">Mag-send sa aming GCash:</p>
            <p class="font-bold text-white text-base mt-1">0912-345-6789</p>
            <p class="text-xs text-gray-400">(Palitan mo ito ng Pangalan mo)</p>
        </div>
        
        <div class="space-y-3">
            <div>
                <label class="block text-xs text-gray-400 mb-1">Magkano ang ipinadala mo?</label>
                <input type="number" placeholder="Halimbawa: 1000" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">GCash Reference Number (13-digits)</label>
                <input type="text" placeholder="I-type ang Ref No. mula sa resibo" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
            <button class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold p-3 rounded-lg text-sm mt-2 transition-all">
                I-pasa ang Resibo para ma-verify
            </button>
        </div>
    </div>

</body>
</html>
